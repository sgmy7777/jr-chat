services:
  frontend:
    image: my-frontend
    build:
      context: ./frontend
    ports:
      - "4001:4001"
    volumes:
      - ./frontend:/app
    environment:
      - BACKEND_URL=http://backend:4000
    networks:
      - jr-chat-network
    depends_on:
      - backend

  backend:
    image: my-backend
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      - PGUSER=postgres
      - PGPASSWORD=1234567899
      - PGHOST=database
      - PGPORT=5432
      - PGDATABASE=jr-chat
      - APP_PORT=4000
    networks:
      - jr-chat-network
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234567899
      - POSTGRES_DB=jr-chat
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - jr-chat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:

networks:
  jr-chat-network:
    driver: bridge